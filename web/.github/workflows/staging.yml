name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # Job 1: Deploy Frontend to Vercel
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build
        working-directory: ./web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_CMS_URL: ${{ secrets.STAGING_CMS_URL }}
          NEXT_PUBLIC_AI_URL: ${{ secrets.STAGING_AI_URL }}
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          vercel-args: '--prod'

  # Job 2: Deploy API to Render
  deploy-api:
    name: Deploy API (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_API_DEPLOY_HOOK }}

  # Job 3: Deploy CMS to Render
  deploy-cms:
    name: Deploy CMS (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_CMS_DEPLOY_HOOK }}

  # Job 4: Deploy AI Service to Render
  deploy-ai-service:
    name: Deploy AI Service (Render)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_AI_DEPLOY_HOOK }}

  # Job 5: Health Check
  health-check:
    name: Health Check All Services
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-api, deploy-cms, deploy-ai-service]
    steps:
      - name: Check API Health
        run: |
          curl -f ${{ secrets.STAGING_API_URL }}/health || exit 1

      - name: Check CMS Health
        run: |
          curl -f ${{ secrets.STAGING_CMS_URL }}/health || exit 1

      - name: Check AI Service Health
        run: |
          curl -f ${{ secrets.STAGING_AI_URL }}/health || exit 1

      - name: Check Frontend
        run: |
          curl -f https://aviva-staging.vercel.app || exit 1