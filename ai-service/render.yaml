services:
  - type: web
    name: aviva-ai-staging
    runtime: node
    region: oregon
    plan: starter
    branch: develop
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NANO_BANANA_API_KEY
        sync: false
      - key: TARGET_AUDIENCE
        value: mujeres 25-44 años
      - key: TARGET_LANGUAGE
        value: es
    healthCheckPath: /health